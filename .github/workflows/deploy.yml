# Build the PWA and publish it to GitHub Pages.
#
# Pages serves over HTTPS, which is what the service worker needs. Building in
# CI rather than committing the built files means pwa/index.html and pwa/sw.js
# can never drift from app/steadyvoice.body.html, and the cache-busting hash is
# always computed from what is actually being shipped.
name: Deploy Steady Voice

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python3 build.py       # stdlib only, no dependencies
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
