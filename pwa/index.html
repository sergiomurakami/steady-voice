<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E7C7B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Steady Voice">
<meta name="description" content="Syllable-timed speech practice and daily severity tracking for a school-age child who stutters frequently. Companion to speech therapy, not a substitute.">
<style>html{color-scheme:light dark} img{max-width:100%} [hidden]{display:none!important}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<title>Steady Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400..600&display=swap">

<style>
/* ─── tokens ─────────────────────────────────────────────────────────── */
:root{
  --ground:#EFF4F2; --surface:#FFFFFF; --surface-2:#F6FAF8; --sunk:#E7EFEC;
  --ink:#0E2422; --ink-2:#41605D; --muted:#7A9490;
  --line:#D9E5E1; --line-strong:#BFD2CD;
  --accent:#0E7C7B; --accent-soft:#DCEEEC; --accent-ink:#FFFFFF;
  --warm:#C06A22; --warm-soft:#F7E9DC;
  --s1:#068C82; --s2:#C06A22;           /* validated chart series, light */
  --good:#2F7D4F; --alert:#B4462C;
  --shadow:0 1px 2px rgba(14,36,34,.05), 0 8px 24px -12px rgba(14,36,34,.16);
  --r:14px; --r-sm:9px; --r-lg:22px;
  --display:"Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --body:"Source Serif 4", Georgia, serif;
  --ui:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0A1817; --surface:#122624; --surface-2:#0F211F; --sunk:#0A1817;
    --ink:#E4EEEB; --ink-2:#A3BCB8; --muted:#78918D;
    --line:#1E3835; --line-strong:#2C4B47;
    --accent:#48BDB4; --accent-soft:#12332F; --accent-ink:#071615;
    --warm:#E1913F; --warm-soft:#2E2016;
    --s1:#00998C; --s2:#CE7C2C;         /* validated chart series, dark */
    --good:#5EB380; --alert:#E2775A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#0A1817; --surface:#122624; --surface-2:#0F211F; --sunk:#0A1817;
  --ink:#E4EEEB; --ink-2:#A3BCB8; --muted:#78918D;
  --line:#1E3835; --line-strong:#2C4B47;
  --accent:#48BDB4; --accent-soft:#12332F; --accent-ink:#071615;
  --warm:#E1913F; --warm-soft:#2E2016;
  --s1:#00998C; --s2:#CE7C2C;
  --good:#5EB380; --alert:#E2775A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--ui); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:none}
:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

/* ─── shell ──────────────────────────────────────────────────────────── */
#app{max-width:600px; margin:0 auto; min-height:100vh; background:var(--ground);
     display:flex; flex-direction:column; position:relative;}
@media(min-width:640px){ #app{border-inline:1px solid var(--line)} }

header.bar{
  position:sticky; top:0; z-index:20; background:var(--surface);
  border-bottom:1px solid var(--line); padding:12px 18px 0;
}
.bar-row{display:flex; align-items:center; gap:12px; justify-content:space-between}
.brand{display:flex; align-items:baseline; gap:9px; min-width:0}
.brand h1{font-family:var(--display); font-size:20px; font-weight:700; margin:0; letter-spacing:-.02em; white-space:nowrap}
.brand .who{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bar-tools{display:flex; gap:6px; align-items:center; flex:none}
.icon-btn{width:34px; height:34px; border-radius:9px; display:grid; place-items:center; color:var(--ink-2); border:1px solid transparent}
.icon-btn:hover{background:var(--sunk); color:var(--ink)}
.icon-btn.on{background:var(--accent-soft); color:var(--accent); border-color:var(--accent)}
.wave-rule{display:block; width:100%; height:14px; margin-top:8px}

main{flex:1; padding:18px 18px 108px}

nav.tabs{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:600px; z-index:30;
  background:var(--surface); border-top:1px solid var(--line);
  display:grid; grid-auto-flow:column; grid-auto-columns:1fr;
  padding:7px 6px calc(7px + env(safe-area-inset-bottom));
}
nav.tabs button{display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px;
  border-radius:11px; color:var(--muted); font-size:10.5px; font-weight:600; letter-spacing:.02em}
nav.tabs button svg{width:21px; height:21px}
nav.tabs button[aria-current="page"]{color:var(--accent); background:var(--accent-soft)}

/* ─── type ───────────────────────────────────────────────────────────── */
h2.view-title{font-family:var(--display); font-size:26px; font-weight:700; letter-spacing:-.025em; margin:0 0 4px; text-wrap:balance}
.view-sub{color:var(--ink-2); font-size:14px; margin:0 0 18px; max-width:52ch}
h3{font-family:var(--display); font-size:17px; font-weight:700; letter-spacing:-.015em; margin:0 0 8px}
.eyebrow{font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 8px}
.prose{font-family:var(--body); font-size:16.5px; line-height:1.62; color:var(--ink-2); max-width:64ch}
.prose p{margin:0 0 12px}
.prose strong{color:var(--ink); font-weight:600}
.prose ul,.prose ol{margin:0 0 12px; padding-left:20px}
.prose li{margin-bottom:6px}
.num{font-variant-numeric:tabular-nums}

/* ─── surfaces ───────────────────────────────────────────────────────── */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px}
.card + .card{margin-top:12px}
.stack{display:flex; flex-direction:column; gap:12px}
.row{display:flex; gap:10px; align-items:center}
.spread{display:flex; gap:10px; align-items:center; justify-content:space-between}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}

.btn{font-family:var(--ui); font-weight:600; font-size:15px; padding:12px 18px; border-radius:11px;
  background:var(--accent); color:var(--accent-ink); display:inline-flex; align-items:center;
  justify-content:center; gap:8px; text-align:center; transition:transform .08s ease, filter .15s ease}
.btn:active{transform:scale(.975)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line-strong)}
.btn.ghost:hover{background:var(--sunk); filter:none}
.btn.warm{background:var(--warm); color:#fff}
.btn.wide{width:100%}
.btn.sm{padding:8px 13px; font-size:13.5px; border-radius:9px}
.btn[disabled]{opacity:.45; pointer-events:none}

.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px;
  font-size:11.5px; font-weight:600; background:var(--sunk); color:var(--ink-2)}
.pill.accent{background:var(--accent-soft); color:var(--accent)}
.pill.warm{background:var(--warm-soft); color:var(--warm)}

.note{border-left:3px solid var(--warm); background:var(--warm-soft); padding:11px 13px;
  border-radius:0 var(--r-sm) var(--r-sm) 0; font-size:14px; color:var(--ink-2)}
.note strong{color:var(--ink)}
.note.calm{border-left-color:var(--accent); background:var(--accent-soft)}

/* ─── today ──────────────────────────────────────────────────────────── */
.hero{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:20px; box-shadow:var(--shadow); position:relative; overflow:hidden}
.hero-top{display:flex; justify-content:space-between; align-items:flex-start; gap:14px}
.greet{font-family:var(--display); font-size:23px; font-weight:700; letter-spacing:-.025em; margin:0; text-wrap:balance}
.greet-sub{font-size:13.5px; color:var(--ink-2); margin:5px 0 0}
.streak{flex:none; text-align:center; background:var(--warm-soft); border-radius:var(--r-sm); padding:8px 12px; min-width:66px}
.streak b{display:block; font-family:var(--display); font-size:24px; line-height:1.05; color:var(--warm); font-variant-numeric:tabular-nums}
.streak span{font-size:9.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--warm); line-height:1.25; display:block}

.mission{display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  padding:13px 14px; border-radius:var(--r); border:1px solid var(--line); background:var(--surface)}
.mission:hover{border-color:var(--line-strong); background:var(--surface-2)}
.mission .tick{width:26px; height:26px; border-radius:99px; border:2px solid var(--line-strong);
  flex:none; display:grid; place-items:center; color:transparent}
.mission.done .tick{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.mission.done .m-name{text-decoration:line-through; color:var(--muted)}
.m-name{font-weight:600; font-size:15px; display:block}
.m-why{font-size:12.5px; color:var(--muted); display:block; margin-top:1px}

/* ─── practice ───────────────────────────────────────────────────────── */
.game-list{display:flex; flex-direction:column; gap:9px}
.game{display:flex; gap:13px; align-items:center; text-align:left; width:100%;
  padding:14px; border-radius:var(--r); border:1px solid var(--line); background:var(--surface)}
.game:hover{border-color:var(--accent); background:var(--surface-2)}
.game.core{border-color:var(--accent); border-width:1.5px}
.game .glyph{width:42px; height:42px; border-radius:12px; flex:none; display:grid; place-items:center;
  background:var(--accent-soft); color:var(--accent)}
.game.warm .glyph{background:var(--warm-soft); color:var(--warm)}
.g-name{font-weight:700; font-size:15.5px; display:block; font-family:var(--display); letter-spacing:-.01em}
.g-tech{font-size:12px; color:var(--muted); display:block; margin-top:1px}

.stage{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  padding:22px 18px; text-align:center; box-shadow:var(--shadow)}
.target{font-family:var(--ui); font-weight:600; letter-spacing:-.02em;
  font-size:clamp(34px, 11vw, 52px); line-height:1.12; margin:14px 0 6px; color:var(--ink); text-wrap:balance}
.target.sentence{font-size:clamp(22px, 6.4vw, 30px); line-height:1.3}
.target .brk{color:var(--accent); font-weight:400; padding:0 .18em; opacity:.75}
.target em{font-style:normal; color:var(--accent); border-bottom:3px solid var(--accent-soft)}
.cue{font-size:13.5px; color:var(--ink-2); margin:0 auto 4px; max-width:40ch; min-height:2.6em}
.counter{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; letter-spacing:.04em}

/* syllable-timed target: syllables are the unit, so they get their own treatment */
.syl{font-family:var(--ui); font-weight:600; font-size:clamp(21px,5.9vw,28px); line-height:1.75;
  margin:16px 0 8px; letter-spacing:-.01em; word-spacing:.3em; text-wrap:balance}
.syl span{display:inline-block; padding:1px 1px; border-radius:5px; transition:background .09s linear, color .09s linear}
.syl span.hit{background:var(--accent); color:var(--accent-ink)}
.syl .dash{color:var(--muted); opacity:.5; font-weight:400}

.beat-wrap{display:flex; align-items:center; justify-content:center; gap:14px; margin:4px 0 2px}
.beat-dot{width:15px; height:15px; border-radius:99px; background:var(--line-strong); transition:transform .08s ease, background .08s ease}
.beat-dot.on{background:var(--accent); transform:scale(1.55)}
.tempo{display:flex; align-items:center; gap:11px; justify-content:center; margin-top:10px; font-size:12.5px; color:var(--muted)}
.tempo input[type=range]{flex:1; max-width:190px; accent-color:var(--accent)}
.tempo b{font-variant-numeric:tabular-nums; color:var(--ink); font-family:var(--display); font-size:15px; min-width:58px}

/* hybrid session */
.hy-bar{display:flex; height:11px; border-radius:99px; overflow:hidden; background:var(--sunk); margin:12px 0 6px}
.hy-bar i{display:block; height:100%}
.hy-bar i.sts{background:var(--s1)}
.hy-bar i.nat{background:var(--s2)}
.hy-legend{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted)}
.hy-phase{font-family:var(--display); font-size:clamp(24px,7vw,32px); letter-spacing:-.025em; margin:14px 0 2px}
.hy-clock{font-family:var(--display); font-size:44px; letter-spacing:-.03em; font-variant-numeric:tabular-nums; margin:2px 0 0}

/* pacer */
.pacer-wrap{margin:6px 0 2px}
.pacer{width:100%; height:66px; display:block}
.pacer-ctl{display:flex; align-items:center; gap:11px; justify-content:center; margin-top:8px; font-size:12.5px; color:var(--muted)}
.pacer-ctl input[type=range]{flex:1; max-width:190px; accent-color:var(--accent)}

/* breathing */
.breath{display:grid; place-items:center; height:210px; position:relative}
.breath-orb{width:92px; height:92px; border-radius:99px; background:var(--accent-soft);
  border:2px solid var(--accent); display:grid; place-items:center; transition:transform 4s cubic-bezier(.4,0,.6,1)}
.breath-orb.in,.breath-orb.hold{transform:scale(2)}
.breath-orb.out{transform:scale(1)}
.breath-word{font-family:var(--display); font-size:15px; font-weight:700; color:var(--accent); letter-spacing:.02em}

.rate-me{display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap}
.rate-me button{flex:1 1 0; min-width:88px; padding:11px 8px; border-radius:11px;
  border:1px solid var(--line-strong); font-size:13.5px; font-weight:600; background:var(--surface)}
.rate-me button:hover{background:var(--sunk)}
.rate-me button.smooth:hover{border-color:var(--accent); color:var(--accent)}
.rate-me button.bumpy:hover{border-color:var(--warm); color:var(--warm)}

.rec-row{display:flex; gap:9px; align-items:center; justify-content:center; margin-top:12px; flex-wrap:wrap}
.rec-dot{width:9px; height:9px; border-radius:99px; background:var(--alert); animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ─── parent ─────────────────────────────────────────────────────────── */
.sr-scale{display:grid; gap:4px; margin:10px 0 8px}
/* Eleven buttons across a phone width: let them be narrow, but keep the
   vertical tap target usable — a parent taps this every single night. */
.sr-scale button{min-height:44px; border-radius:8px; border:1px solid var(--line-strong); font-weight:600;
  font-size:14px; font-variant-numeric:tabular-nums; background:var(--surface); color:var(--ink-2); display:grid; place-items:center}
.sr-scale button:hover{border-color:var(--accent)}
.sr-scale button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.sr-ends{display:flex; justify-content:space-between; font-size:11px; color:var(--muted)}

.sit-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
.sit-row:last-child{border-bottom:none}
.sit-name{flex:1; font-size:14px; min-width:0}
.sit-name small{display:block; color:var(--muted); font-size:11.5px}
.sit-pick{display:flex; gap:3px; flex:none}
.sit-pick button{width:27px; height:27px; border-radius:7px; border:1px solid var(--line-strong);
  font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--ink-2); background:var(--surface)}
.sit-pick button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}

.stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 13px}
.stat b{display:block; font-family:var(--display); font-size:25px; letter-spacing:-.03em; font-variant-numeric:tabular-nums; line-height:1.1}
.stat span{font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.03em; display:block; margin-top:3px}

.chart-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:2px}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); margin-top:8px}
.legend i{width:11px; height:11px; border-radius:3px; display:inline-block; margin-right:5px; vertical-align:-1px}
.chart-scroll{overflow-x:auto}
figcaption{font-size:12px; color:var(--muted); margin-top:8px; line-height:1.45}

table.log{width:100%; border-collapse:collapse; font-size:13.5px}
table.log th{text-align:left; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
  font-weight:600; padding:0 8px 7px 0; border-bottom:1px solid var(--line)}
table.log td{padding:9px 8px 9px 0; border-bottom:1px solid var(--line); vertical-align:top}
table.log td.n{font-variant-numeric:tabular-nums; white-space:nowrap}

.counter-pad{display:flex; align-items:center; gap:12px; justify-content:space-between}
.counter-pad .big{font-family:var(--display); font-size:32px; font-variant-numeric:tabular-nums; letter-spacing:-.03em; min-width:52px; text-align:center}
.step{width:44px; height:44px; border-radius:12px; border:1px solid var(--line-strong); display:grid; place-items:center; font-size:20px; font-weight:600}
.step:hover{background:var(--sunk)}

input[type=text],input[type=number],textarea,select{width:100%; padding:10px 12px; border-radius:10px;
  border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink); font-size:15px; font-family:var(--ui)}
textarea{resize:vertical; min-height:74px; line-height:1.5}
label.fld{display:block; font-size:12.5px; font-weight:600; color:var(--ink-2); margin-bottom:5px}

/* ─── learn / directory ──────────────────────────────────────────────── */
details.acc{border:1px solid var(--line); border-radius:var(--r); background:var(--surface); overflow:hidden}
details.acc + details.acc{margin-top:9px}
details.acc > summary{padding:14px 16px; cursor:pointer; font-weight:600; font-size:15px; list-style:none;
  display:flex; justify-content:space-between; align-items:center; gap:10px}
details.acc > summary::-webkit-details-marker{display:none}
details.acc > summary::after{content:"+"; color:var(--muted); font-size:19px; font-weight:400; flex:none}
details.acc[open] > summary::after{content:"−"}
details.acc[open] > summary{border-bottom:1px solid var(--line)}
.acc-body{padding:14px 16px 16px}

.do-dont{display:grid; gap:10px}
@media(min-width:520px){ .do-dont{grid-template-columns:1fr 1fr} }
.dd{border-radius:var(--r); padding:14px; border:1px solid var(--line)}
.dd.do{background:var(--accent-soft); border-color:transparent}
.dd.dont{background:var(--warm-soft); border-color:transparent}
.dd h4{margin:0 0 8px; font-family:var(--display); font-size:14px; letter-spacing:.02em; text-transform:uppercase}
.dd.do h4{color:var(--accent)} .dd.dont h4{color:var(--warm)}
.dd ul{margin:0; padding-left:18px; font-size:14px; line-height:1.55; color:var(--ink-2)}
.dd li{margin-bottom:5px}

.clinic{border:1px solid var(--line); border-radius:var(--r); padding:14px; background:var(--surface)}
.clinic + .clinic{margin-top:10px}
.clinic.star{border-color:var(--accent); border-width:1.5px}
.clinic h4{margin:0 0 3px; font-family:var(--display); font-size:15.5px; letter-spacing:-.01em}
.clinic .meta{font-size:12.5px; color:var(--muted); margin:0 0 8px}
.clinic p{font-size:14px; color:var(--ink-2); margin:0 0 9px; line-height:1.5}
.clinic a{color:var(--accent); font-size:13.5px; font-weight:600; text-decoration:none; word-break:break-word}
.clinic a:hover{text-decoration:underline}
.contact{font-size:13px; color:var(--ink-2); font-variant-numeric:tabular-nums}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:96px; z-index:50;
  background:var(--ink); color:var(--ground); padding:11px 18px; border-radius:99px;
  font-size:14px; font-weight:600; box-shadow:var(--shadow); pointer-events:none;
  opacity:0; transition:opacity .22s ease, bottom .22s ease}
.toast.show{opacity:1; bottom:104px}

.empty{text-align:center; padding:34px 18px; color:var(--muted); font-size:14px}
.disclaimer{font-size:12.5px; color:var(--muted); line-height:1.55; padding:14px 2px 0; border-top:1px solid var(--line); margin-top:22px}
</style>

</head>
<body>
<div id="app">
  <header class="bar">
    <div class="bar-row">
      <div class="brand">
        <h1>Steady Voice</h1>
        <span class="who" id="whoLabel"></span>
      </div>
      <div class="bar-tools">

/* ═══════════════════════════════════════════════════════════════════════
   STEADY VOICE
   Practice and tracking for a school-age child who stutters frequently
   across all contexts — including one-on-one with a parent — but who is
   socially confident, unafraid to speak, and not ashamed of stuttering.

   That profile changes the design. The work is MOTOR, not emotional:
   rhythm, rate and smooth production, plus transfer into everyday talk.
   There is no desensitisation, no courage ladder, no avoidance tracking —
   this child has nothing to desensitise and avoids nothing.

   The centrepiece is syllable-timed speech as specified in the Oakville
   Program (Australian Stuttering Research Centre, UTS) — the school-age
   STS program, whose Phase II trial in 6–11 year olds reported a 77%
   group mean severity reduction at 12 months post-treatment.

   PORTING NOTE (React Native): the four layers below are deliberately
   separate. Storage is the only browser-coupled layer.
   ═══════════════════════════════════════════════════════════════════ */

/* ── 1. STORAGE ADAPTER ─────────────────────────────────────────────── */
const Storage = {
  KEY: "steadyvoice.v1",
  read(){ try{ const r = localStorage.getItem(this.KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } },
  write(o){ try{ localStorage.setItem(this.KEY, JSON.stringify(o)); return true; }catch(e){ return false; } }
};

/* ── 2. STATE ───────────────────────────────────────────────────────── */
const today = () => new Date().toISOString().slice(0,10);
const addDays = (iso,n) => { const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };

const DEFAULTS = {
  profile:{ name:"", startedOn: today() },
  mode:"kid",
  theme:null,
  srMax:10,          // 10 = Oakville 0–10 scale · 9 = Lidcombe 0–9
  bpm:120,           // syllable-timed speech tempo, carried between sessions
  days:{},           // iso -> { sr, minutes, done[], notes, transfer, sit{} }
  outLoud:[],        // { date, text }
  lastOpen:null
};

/* Deep-clone DEFAULTS before merging. A shallow Object.assign would leave
   S.days and S.profile pointing AT the DEFAULTS objects on a fresh install,
   so every rating written would also mutate DEFAULTS — and "erase all data",
   which restores from DEFAULTS, would hand the old data straight back. */
const fresh = () => JSON.parse(JSON.stringify(DEFAULTS));
let S = Object.assign(fresh(), Storage.read() || {});
S.days = S.days || {}; S.outLoud = S.outLoud || []; S.srMax = S.srMax || 10; S.bpm = S.bpm || 120;
S.profile = S.profile || { name:"", startedOn: today() };

function save(){ Storage.write(S); }
function day(iso){
  iso = iso || today();
  if(!S.days[iso]) S.days[iso] = { sr:null, minutes:0, done:[], notes:"", transfer:0, sit:{} };
  if(!S.days[iso].sit) S.days[iso].sit = {};
  return S.days[iso];
}
function setDay(iso, patch){ Object.assign(day(iso), patch); save(); }
const practised = iso => { const r = S.days[iso]; return !!(r && (r.minutes>0 || (r.done && r.done.length))); };

/* Consecutive days of practice. If today hasn't been practised yet the run is
   still alive — counting from today would show a 0 to a child who simply
   opened the app before breakfast. */
function streak(){
  let d = practised(today()) ? today() : addDays(today(), -1);
  let n = 0;
  while(n < 999 && practised(d)){ n++; d = addDays(d, -1); }
  return n;
}
function last(n){
  const out=[]; let d=today();

function drawRuleWave(){
  const w=600,h=14,mid=h/2,pts=[];
  const energy = Math.min(1, 0.35 + streak()*0.09);
  for(let x=0;x<=w;x+=6){
    const a = Math.sin(x/26)*3.4*energy + Math.sin(x/9.5)*1.5*energy;
    pts.push(`${x},${(mid+a).toFixed(2)}`);
  }
  el("ruleWave").setAttribute("d","M"+pts.join(" L"));
}

/* ── shared audio: one metronome click, built on demand ─────────────── */
let AC = null;
function click(strong){
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.frequency.value = strong ? 1180 : 880;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(strong ? 0.16 : 0.1, t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.075);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.09);
  }catch(e){ /* no audio on this device — the visual beat still runs */ }
}

function pickMissions(){
  // Rotates by date. Always opens with a rhythm-and-rate exercise, because
  // that is the core of the work for a child who bumps frequently everywhere.
  const seed = new Date().getDate();
  const core = GAMES.filter(g=>g.group==="Rhythm and rate");
  const first = core[seed % core.length];
  const rest  = GAMES.filter(g=>g!==first);
  return [ first, rest[(seed+2) % rest.length], rest[(seed+5) % rest.length] ];
}
function outLoudOfTheDay(){
  const seed = new Date().getDate() + new Date().getMonth()*31;
  return OUT_LOUD[seed % OUT_LOUD.length];
}

function viewPractice(){

/* ── the practice stage ─────────────────────────────────────────────── */
function viewGame(id){
  const g = gameById(id);
  if(!g) return viewPractice();
  if(id === "sts")    return viewSTS();
  if(id === "hybrid") return viewHybrid();

  const MODES = {
    onset:{ items:[...EASY_ONSET, ...EASY_ONSET_SENTENCES], speak:true,
      how:"Start the word with a soft, gradual voice — ease into it rather than punching it. Let the sound fade in." },
    contact:{ items:[...LIGHT_CONTACT, ...LIGHT_CONTACT_SENTENCES], speak:true,
      how:"Touch your lips, tongue and teeth <em>lightly</em> on the p, b, t, d, k and g sounds. Feather, not hammer." },
    stretch:{ items:STRETCHY, pacer:true, speak:true,
      how:"Stretch your vowels and ease into every sound. Speak along with the wave — match its speed." },
    phrase:{ items:PHRASING, phrasing:true, speak:true,
      how:"Take a small pause at every <span class='brk'>/</span>. The pauses belong to you. Nobody is timing you." },
    ladder:{ ladder:true, speak:true,
      how:"Start with one word. When it comes out smooth, add the next bit. If a rung is bumpy, drop back one and go again." },
    rescue:{ rescueMode:true,
      how:"Three moves for when a word gets properly stuck. Practise them calmly so they're there when you need them." },
    breath:{ breathMode:true,
      how:"Speech happens on the way <em>out</em>. Breathe in through your nose, then talk on the way out." }
  };
  const M = MODES[id];
  let i=0, ladderStep=0, ladderSet=0;

  const currentText = () =>
    M.ladder ? LADDER[ladderSet][ladderStep] :
    M.rescueMode ? RESCUE[i % RESCUE.length].do :
    M.items[i % M.items.length];
  const currentCue = () =>
    M.rescueMode ? `<strong>${RESCUE[i%RESCUE.length].name}</strong> · ${RESCUE[i%RESCUE.length].tech}<br>${RESCUE[i%RESCUE.length].cue}` : M.how;
  const counterText = () =>
    M.ladder ? `Set ${ladderSet+1} of ${LADDER.length} · rung ${ladderStep+1} of 6` :
    M.rescueMode ? `Move ${(i%RESCUE.length)+1} of ${RESCUE.length}` :
    `${(i % M.items.length)+1} of ${M.items.length}`;
  const renderTarget = () => {
    const t = currentText();
    if(M.phrasing) return t.split(" / ").map(c=>`<span>${esc(c)}</span>`).join('<span class="brk">/</span>');
    if(M.rescueMode) return esc(t);
    return esc(t);
  };

  const html = `
    <div class="row" style="margin-bottom:14px">
      <button class="btn ghost sm" data-go="practice">← Practice</button>
      <span class="pill accent">${g.tech}</span>
    </div>
    <h2 class="view-title" style="margin-bottom:14px">${g.name}</h2>

    <div class="stage">
      ${M.breathMode ? `
        <div class="breath"><div class="breath-orb out" id="orb"><span class="breath-word" id="breathWord">Ready</span></div></div>
        <p class="cue" id="cue">${M.how}</p>
        <button class="btn wide" id="breathBtn">Start breathing</button>
      ` : `
        ${M.pacer ? `
          <div class="pacer-wrap">
            <svg class="pacer" id="pacer" viewBox="0 0 320 66" preserveAspectRatio="none" aria-hidden="true">
              <path id="pacerPath" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" d=""/>
              <circle id="pacerDot" r="6" fill="var(--warm)" cx="0" cy="33"/>
            </svg>
            <div class="pacer-ctl"><span>slow</span>
              <input type="range" id="pacerRate" min="3" max="11" value="5" aria-label="Speaking pace">
              <span>faster</span></div>
          </div>` : ""}
        <p class="counter">${counterText()}</p>
        <p class="target ${(M.phrasing||M.rescueMode||currentText().length>14)?"sentence":""}" id="target">${renderTarget()}</p>
        <p class="cue" id="cue">${currentCue()}</p>
        <div class="row" style="justify-content:center; gap:8px; flex-wrap:wrap">
          ${M.speak ? `<button class="btn ghost sm" id="hearBtn">🔊 Hear it</button>` : ""}
          <button class="btn ghost sm" id="recBtn">● Record me</button>
          <button class="btn ghost sm" id="playBtn" disabled>▶ Play back</button>
        </div>
        <div class="rec-row" id="recStatus"></div>
        <div class="rate-me">
          <button class="smooth" data-rate="smooth">Smooth</button>
          <button class="bumpy" data-rate="bumpy">Bumpy</button>
        </div>
        <p class="counter" style="margin-top:10px">You rate it yourself. Nothing is listening or scoring you.</p>
      `}
    </div>

    ${M.ladder ? `<button class="btn ghost wide" style="margin-top:12px" id="nextSet">Different ladder →</button>` : ""}

    <div class="card" style="margin-top:14px">
      <p class="eyebrow">Why this one</p>
      <p style="margin:0; font-size:14.5px; color:var(--ink-2); line-height:1.55">${WHY[id]}</p>
    </div>
    <div class="row" style="margin-top:14px; justify-content:center">
      <button class="btn" id="doneBtn">Finish practice</button>
    </div>`;

  function mount(){
    let rafId=null, breathTimer=null, mediaRec=null, chunks=[], audioUrl=null, audioEl=null, startedAt=Date.now();

    if(M.pacer){
      const path=el("pacerPath"), dot=el("pacerDot"), rateInput=el("pacerRate");
      const t0 = performance.now();
      const draw = now => {
        const period = 3400 - (+rateInput.value)*220;
        const p = ((now-t0)%period)/period, pts=[];
        for(let x=0;x<=320;x+=4){ pts.push(`${x},${(33+Math.sin((x/320)*Math.PI*2.5 - p*Math.PI*2)*19).toFixed(1)}`); }
        path.setAttribute("d","M"+pts.join(" L"));
        const dx=p*320;
        dot.setAttribute("cx", dx.toFixed(1));
        dot.setAttribute("cy",(33+Math.sin((dx/320)*Math.PI*2.5 - p*Math.PI*2)*19).toFixed(1));
        rafId = requestAnimationFrame(draw);
      };
      if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches) rafId = requestAnimationFrame(draw);
      else { const pts=[]; for(let x=0;x<=320;x+=4) pts.push(`${x},${(33+Math.sin((x/320)*Math.PI*2.5)*19).toFixed(1)}`); path.setAttribute("d","M"+pts.join(" L")); }
    }

    if(M.breathMode){
      const orb=el("orb"), word=el("breathWord"), btn=el("breathBtn");
      let running=false, phase=0;
      const PHASES=[["in","Breathe in",4000],["hold","Hold",1500],["out","Speak out",5500]];
      const step=()=>{ if(!running) return; const [c,l,ms]=PHASES[phase%3]; orb.className="breath-orb "+c; word.textContent=l; phase++; breathTimer=setTimeout(step,ms); };
      btn.addEventListener("click",()=>{ running=!running; btn.textContent = running?"Stop":"Start breathing";
        if(running){ phase=0; step(); } else { clearTimeout(breathTimer); orb.className="breath-orb out"; word.textContent="Ready"; } });
    }

    function refresh(){
      const t=el("target"); if(!t) return;
      t.innerHTML = renderTarget();
      t.className = "target " + ((M.phrasing||M.rescueMode||currentText().length>14)?"sentence":"");
      el("cue").innerHTML = currentCue();
      const c = document.querySelector(".counter"); if(c) c.textContent = counterText();
    }
    function advance(up){
      if(M.ladder) ladderStep = up ? Math.min(5,ladderStep+1) : Math.max(0,ladderStep-1);
      else i++;
      refresh();
    }
    document.querySelectorAll("[data-rate]").forEach(b=>b.addEventListener("click",()=>{
      const smooth = b.dataset.rate==="smooth";
      toast(smooth ? (M.ladder && ladderStep===5 ? "Top of the ladder" : "Good one") : (M.ladder ? "Drop back one rung" : "Fine — next"));
      advance(smooth);
    }));
    const ns = el("nextSet");
    if(ns) ns.addEventListener("click",()=>{ ladderSet=(ladderSet+1)%LADDER.length; ladderStep=0; refresh(); });

    const hearBtn = el("hearBtn");
    if(hearBtn) hearBtn.addEventListener("click",()=>{
      if(!("speechSynthesis" in window)) return toast("This device can't read it out");
      const u = new SpeechSynthesisUtterance(currentText().replace(/<[^>]+>/g,"").replace(/ \/ /g,", "));
      u.rate = M.pacer ? 0.62 : 0.8;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    });

    const recBtn=el("recBtn"), playBtn=el("playBtn"), recStatus=el("recStatus");
    if(recBtn){
      recBtn.addEventListener("click", async ()=>{
        if(mediaRec && mediaRec.state==="recording"){ mediaRec.stop(); return; }
        if(!navigator.mediaDevices || !window.MediaRecorder) return toast("Recording isn't available in this browser");
        try{
          const stream = await navigator.mediaDevices.getUserMedia({audio:true});
          chunks=[]; mediaRec = new MediaRecorder(stream);
          mediaRec.ondataavailable = e=>chunks.push(e.data);
          mediaRec.onstop = ()=>{
            stream.getTracks().forEach(t=>t.stop());
            if(audioUrl) URL.revokeObjectURL(audioUrl);
            audioUrl = URL.createObjectURL(new Blob(chunks, {type: mediaRec.mimeType || "audio/mp4"}));
            audioEl = new Audio(audioUrl);
            recBtn.textContent="● Record me"; playBtn.disabled=false;
            recStatus.innerHTML = `<span style="font-size:12.5px;color:var(--muted)">On this device only, until you leave this screen.</span>`;
          };
          mediaRec.start(); recBtn.textContent="■ Stop";
          recStatus.innerHTML = `<span class="rec-dot"></span><span style="font-size:12.5px;color:var(--ink-2)">Recording…</span>`;
        }catch(e){ toast("Microphone permission was declined"); }
      });
      playBtn.addEventListener("click",()=>{ if(audioEl){ audioEl.currentTime=0; audioEl.play(); } });
    }

    el("doneBtn").addEventListener("click",()=>{
      const d=day(), mins = Math.max(1, Math.min(30, Math.round((Date.now()-startedAt)/60000) || 5));
      d.minutes=(d.minutes||0)+mins; if(!d.done.includes(id)) d.done.push(id);
      save(); drawRuleWave(); toast(`${mins} min logged`); go("today");
    });

    cleanup = ()=>{
      if(rafId) cancelAnimationFrame(rafId);
      if(breathTimer) clearTimeout(breathTimer);
      if(mediaRec && mediaRec.state==="recording") mediaRec.stop();
      if(audioUrl) URL.revokeObjectURL(audioUrl);
      if("speechSynthesis" in window) speechSynthesis.cancel();
    };
  }
  return { html, mount };
}

/* ── Syllable Time — the Oakville centrepiece ───────────────────────── */
function viewSTS(){
  let short = true, i = 0;
  const items = () => short ? STS_SHORT : STS_LONG;

  /* Split "chil-dren are play-ing" into syllable tokens, keeping the visual
     hyphens and word gaps so the child reads it the way it is spoken. */
  function tokens(text){
    const out = [];
    text.split(" ").forEach((word, wi) => {
      if(wi) out.push({type:"space"});
      word.split("-").forEach((syl, si, arr) => {
        out.push({type:"syl", text:syl});
        if(si < arr.length-1) out.push({type:"dash"});
      });
    });
    return out;
  }
  function renderSyl(){
    return tokens(items()[i % items().length]).map((t,n)=>
      /* a plain text space, not a styled empty span: an inline-block holding
         only whitespace renders as zero width, so the sentence would reach a
         screen reader (and the clipboard) as "Thecatsatdown". Word separation
         comes from word-spacing on .syl instead. */
      t.type==="space" ? " " :
      t.type==="dash"  ? `<span class="dash">-</span>` :
      `<span data-syl="${n}">${esc(t.text)}</span>`
    ).join("");
  }

  const html = `
    <div class="row" style="margin-bottom:14px">
      <button class="btn ghost sm" data-go="practice">← Practice</button>
      <span class="pill accent">Oakville Program</span>
    </div>
    <h2 class="view-title" style="margin-bottom:4px">Syllable Time</h2>
    <p class="view-sub">One beat per syllable. Every syllable the same length, evenly stressed, joined smoothly to the next — normal volume, normal pitch, normal expression. Not robot voice, not chopped up.</p>

    <div class="stage">
      <div class="beat-wrap">
        ${[0,1,2,3].map(n=>`<span class="beat-dot" data-beat="${n}"></span>`).join("")}
      </div>
      <p class="counter" id="stsCount">${short?"Short":"Longer"} · ${(i%items().length)+1} of ${items().length}</p>
      <p class="syl" id="sylTarget">${renderSyl()}</p>
      <p class="cue" id="stsCue">Say it with the beat. Slow first — speed comes later, and only when slow is easy.</p>

      <div class="tempo">
        <span>slower</span>
        <input type="range" id="bpm" min="60" max="200" step="5" value="${S.bpm}" aria-label="Beats per minute">
        <span>faster</span>
        <b id="bpmVal">${S.bpm} bpm</b>
      </div>

      <div class="row" style="justify-content:center; gap:8px; margin-top:14px; flex-wrap:wrap">
        <button class="btn" id="startBtn">▶ Start beat</button>
        <button class="btn ghost sm" id="soundBtn" aria-pressed="true">🔊 Click on</button>
      </div>
      ${/iPad|iPhone|iPod/.test(navigator.userAgent)
        ? `<p class="counter" style="margin-top:7px">No click? The side silent switch mutes it. The dots still keep the beat.</p>` : ""}
      <div class="row" style="justify-content:center; gap:8px; margin-top:8px; flex-wrap:wrap">
        <button class="btn ghost sm" id="recBtn">● Record me</button>
        <button class="btn ghost sm" id="playBtn" disabled>▶ Play back</button>
      </div>
      <div class="rec-row" id="recStatus"></div>

      <div class="rate-me">
        <button class="smooth" data-next="1">Next sentence →</button>
        <button class="ghost" id="lenBtn">Longer ones →</button>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <p class="eyebrow">Getting it right</p>
      <div class="prose" style="font-size:15px">
        <ul style="margin:0">
          <li><strong>Even, not chopped.</strong> Syllables are joined smoothly — legato, like singing a line. If it sounds staccato, slow the beat down.</li>
          <li><strong>Keep the expression.</strong> Normal volume, pitch and intonation. It should sound like a person, just evenly timed.</li>
          <li><strong>Slow first.</strong> Start well below normal speed. Only push the tempo up once the slow version is effortless.</li>
          <li><strong>Grown-ups do it too.</strong> The parent speaks in syllable talking during practice as well. It is a duet, not a test.</li>
        </ul>
      </div>
    </div>

    <div class="card">
      <p class="eyebrow">Why this one</p>
      <p style="margin:0; font-size:14.5px; color:var(--ink-2); line-height:1.55">${WHY.sts}</p>
    </div>

    <div class="row" style="margin-top:14px; justify-content:center">
      <button class="btn" id="doneBtn">Finish practice</button>
    </div>`;

  function mount(){
    let timer=null, beat=0, running=false, sound=true;
    let mediaRec=null, chunks=[], audioUrl=null, audioEl=null, startedAt=Date.now();
    const sylEls = () => Array.from(document.querySelectorAll("#sylTarget [data-syl]"));
    let idx = 0;

    function stop(){
      running=false; clearInterval(timer); timer=null;
      el("startBtn").textContent="▶ Start beat";
      document.querySelectorAll(".beat-dot").forEach(d=>d.classList.remove("on"));
      sylEls().forEach(s=>s.classList.remove("hit"));
    }
    function tickOnce(){
      const dots = document.querySelectorAll(".beat-dot");
      dots.forEach(d=>d.classList.remove("on"));
      dots[beat % 4].classList.add("on");
      if(sound) click(beat % 4 === 0);
      const list = sylEls();
      if(list.length){
        list.forEach(s=>s.classList.remove("hit"));
        list[idx % list.length].classList.add("hit");
        idx++;
      }
      beat++;
    }
    function start(){
      running=true; beat=0; idx=0;
      el("startBtn").textContent="■ Stop";
      tickOnce();
      timer = setInterval(tickOnce, 60000 / (+el("bpm").value));
    }

    el("startBtn").addEventListener("click", ()=> running ? stop() : start());
    el("soundBtn").addEventListener("click", e=>{

      S.bpm = +e.target.value; save();
      el("bpmVal").textContent = S.bpm + " bpm";
      if(running){ clearInterval(timer); timer = setInterval(tickOnce, 60000 / S.bpm); }
    });

    function refresh(){
      el("sylTarget").innerHTML = renderSyl();
      el("stsCount").textContent = `${short?"Short":"Longer"} · ${(i%items().length)+1} of ${items().length}`;
      idx = 0;
    }
    document.querySelector("[data-next]").addEventListener("click", ()=>{ i++; refresh(); });
    el("lenBtn").addEventListener("click", e=>{
      short = !short; i = 0; refresh();
      e.currentTarget.textContent = short ? "Longer ones →" : "Shorter ones →";
    });

    const recBtn=el("recBtn"), playBtn=el("playBtn"), recStatus=el("recStatus");
    recBtn.addEventListener("click", async ()=>{
      if(mediaRec && mediaRec.state==="recording"){ mediaRec.stop(); return; }
      if(!navigator.mediaDevices || !window.MediaRecorder) return toast("Recording isn't available in this browser");
      try{
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        chunks=[]; mediaRec = new MediaRecorder(stream);
        mediaRec.ondataavailable = e=>chunks.push(e.data);
        mediaRec.onstop = ()=>{
          stream.getTracks().forEach(t=>t.stop());
          if(audioUrl) URL.revokeObjectURL(audioUrl);
          audioUrl = URL.createObjectURL(new Blob(chunks, {type: mediaRec.mimeType || "audio/mp4"}));

        };
        mediaRec.start(); recBtn.textContent="■ Stop";
        recStatus.innerHTML = `<span class="rec-dot"></span><span style="font-size:12.5px;color:var(--ink-2)">Recording…</span>`;
      }catch(e){ toast("Microphone permission was declined"); }
    });
    playBtn.addEventListener("click",()=>{ if(audioEl){ audioEl.currentTime=0; audioEl.play(); } });

    el("doneBtn").addEventListener("click",()=>{
      const d=day(), mins = Math.max(1, Math.min(30, Math.round((Date.now()-startedAt)/60000) || 5));
      d.minutes=(d.minutes||0)+mins; if(!d.done.includes("sts")) d.done.push("sts");
      save(); drawRuleWave(); toast(`${mins} min logged`); go("today");
    });

    cleanup = ()=>{
      clearInterval(timer);
      if(mediaRec && mediaRec.state==="recording") mediaRec.stop();
      if(audioUrl) URL.revokeObjectURL(audioUrl);
    };
  }
  return { html, mount };
}

        <p style="margin:0 0 10px"><strong>Changeover.</strong> Tell them plainly that the second half is normal talking now. If they keep using syllables for a bit, leave it — let them ease out on their own rather than prompting.</p>
        <p style="margin:0 0 10px"><strong>Second half.</strong> Ordinary conversation. Praise the smooth speech generously and genuinely. If a word is unambiguously stuttered you can occasionally ask for it again in syllable talking — sparingly, never as a telling-off, and never if you are unsure whether it was a real stutter.</p>
        <p style="margin:0"><strong>Shifting the ratio.</strong> As stuttering drops, move the slider toward natural — 50, then 60, then 70 per cent natural. If bumps climb during the natural half, move it back. The aim is to need no syllable talking at all.</p>
      </div>
    </div>

    <div class="card">
      <p class="eyebrow">Why this one</p>
      <p style="margin:0; font-size:14.5px; color:var(--ink-2); line-height:1.55">${WHY.hybrid}</p>
    </div>

    <div class="row" style="margin-top:14px; justify-content:center">
      <button class="btn" id="doneBtn">Finish practice</button>
    </div>`;

  function mount(){
    let tick=null, left=0, phase=0, running=false, startedAt=Date.now();
    const fmt = s => `${Math.floor(s/60)}:${String(Math.max(0,s%60)).padStart(2,"0")}`;
    const stsSecs = () => Math.round(total*60*ratio/100);
    const natSecs = () => total*60 - stsSecs();

    function paint(){
      el("ratioVal").textContent = `${ratio} / ${100-ratio}`;
      el("totalVal").textContent = `${total} min`;
      el("hyBar").innerHTML = `<i class="sts" style="width:${ratio}%"></i><i class="nat" style="width:${100-ratio}%"></i>`;
      if(!running) el("hyClock").textContent = fmt(stsSecs());

    function setPhase(p){
      phase = p;
      if(p===0){ el("hyLabel").textContent="Part one"; el("hyPhase").textContent="Syllable talking"; left = stsSecs(); }
      else if(p===1){ el("hyLabel").textContent="Part two"; el("hyPhase").textContent="Normal talking"; left = natSecs(); toast("Switch to normal talking"); }
      else { el("hyLabel").textContent="Done"; el("hyPhase").textContent="Session finished"; }
      el("hyClock").textContent = fmt(left);

    function stop(){ running=false; clearInterval(tick); el("hyStart").textContent="Start session"; }

    el("ratio").addEventListener("input", e=>{ ratio=+e.target.value; paint(); });
    el("total").addEventListener("input", e=>{ total=+e.target.value; paint(); });

    el("hyStart").addEventListener("click", ()=>{

      running = true; el("hyStart").textContent = "Pause";

      tick = setInterval(()=>{
        left--;
        el("hyClock").textContent = fmt(left);
        if(left<=0){
          if(phase===0){ click(true); setPhase(1); }
          else { click(true); setPhase(2); stop();
            const d=day(); d.minutes=(d.minutes||0)+total; if(!d.done.includes("hybrid")) d.done.push("hybrid");
            save(); drawRuleWave(); toast(`Session done — ${total} min logged`); }
        }
      },1000);
    });
    el("hyReset").addEventListener("click", ()=>{ stop(); phase=0; paint(); el("hyLabel").textContent="Ready"; el("hyPhase").textContent="Set it up, then press start"; });

    el("doneBtn").addEventListener("click",()=>{
      const d=day(), mins = Math.max(1, Math.min(30, Math.round((Date.now()-startedAt)/60000) || 5));
      d.minutes=(d.minutes||0)+mins; if(!d.done.includes("hybrid")) d.done.push("hybrid");
      save(); drawRuleWave(); toast(`${mins} min logged`); go("today");
    });

    paint(); setPhase(0);
    cleanup = ()=>clearInterval(tick);
  }
  return { html, mount };
}

function viewRead(){

  const html = `
    <h2 class="view-title">Reading out loud</h2>

    <div class="row" style="gap:7px; margin-bottom:14px; flex-wrap:wrap">
      ${Object.keys(READING).map(k=>`<button class="btn ${String(k)===String(lvl)?"":"ghost"} sm" data-lvl="${k}">${READING[k].label}</button>`).join("")}
    </div>
    <div class="stage">
      <p class="counter" id="rCount">1 of ${set.items.length}</p>
      <p class="target ${lvl>=3?"sentence":""}" id="rTarget" style="${lvl==4?"font-size:19px;line-height:1.55;text-align:left":""}">${esc(set.items[0])}</p>
      <div class="row" style="justify-content:center; gap:8px; flex-wrap:wrap; margin-top:6px">
        <button class="btn ghost sm" id="rHear">🔊 Hear it</button>

        <button class="btn ghost sm" id="rPlay" disabled>▶ Play back</button>
      </div>
      <div class="rec-row" id="rStatus"></div>
      <div class="rate-me">
        <button class="ghost" id="rPrev">← Back</button>
        <button class="smooth" id="rNext">Next →</button>
      </div>
    </div>
    <div class="note calm" style="margin-top:14px">
      <strong>How to run it together.</strong> First pass in unison, at the same time, out loud. Then let them
      read it alone. Then move on. Don't correct the bumps as they read — you are building smooth reading, not
      accurate reading.
    </div>`;
  function mount(){
    let mediaRec=null, chunks=[], audioUrl=null, audioEl=null;
    const show=()=>{ el("rTarget").textContent=set.items[i]; el("rCount").textContent=`${i+1} of ${set.items.length}`; };
    el("rNext").addEventListener("click",()=>{ i=(i+1)%set.items.length; show(); });
    el("rPrev").addEventListener("click",()=>{ i=(i-1+set.items.length)%set.items.length; show(); });
    document.querySelectorAll("[data-lvl]").forEach(b=>b.addEventListener("click",()=>go("read",+b.dataset.lvl)));
    el("rHear").addEventListener("click",()=>{
      if(!("speechSynthesis" in window)) return toast("This device can't read it out");
      const u=new SpeechSynthesisUtterance(set.items[i]); u.rate=0.78;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    });
    el("rRec").addEventListener("click", async ()=>{
      if(mediaRec && mediaRec.state==="recording"){ mediaRec.stop(); return; }
      if(!navigator.mediaDevices || !window.MediaRecorder) return toast("Recording isn't available in this browser");
      try{
        const stream=await navigator.mediaDevices.getUserMedia({audio:true});
        chunks=[]; mediaRec=new MediaRecorder(stream);
        mediaRec.ondataavailable=e=>chunks.push(e.data);
        mediaRec.onstop=()=>{
          stream.getTracks().forEach(t=>t.stop());
          if(audioUrl) URL.revokeObjectURL(audioUrl);
          audioUrl=URL.createObjectURL(new Blob(chunks, {type: mediaRec.mimeType || "audio/mp4"}));
          audioEl=new Audio(audioUrl);
          el("rRec").textContent="● Record me"; el("rPlay").disabled=false;
          el("rStatus").innerHTML=`<span style="font-size:12.5px;color:var(--muted)">Stays on this device. Nothing is uploaded.</span>`;
        };
        mediaRec.start(); el("rRec").textContent="■ Stop";
        el("rStatus").innerHTML=`<span class="rec-dot"></span><span style="font-size:12.5px;color:var(--ink-2)">Recording…</span>`;
      }catch(e){ toast("Microphone permission was declined"); }
    });
    el("rPlay").addEventListener("click",()=>{ if(audioEl){ audioEl.currentTime=0; audioEl.play(); } });
    cleanup=()=>{ if(mediaRec&&mediaRec.state==="recording") mediaRec.stop(); if(audioUrl) URL.revokeObjectURL(audioUrl); if("speechSynthesis" in window) speechSynthesis.cancel(); };
  }
  return { html, mount };
}

/* ── charts ─────────────────────────────────────────────────────────── */
function severityChart(rows){
  const W=520,H=210,L=32,R=12,T=14,B=28, iw=W-L-R, ih=H-T-B, MAX=S.srMax;
  const x = n => L + (rows.length<=1 ? iw/2 : (n/(rows.length-1))*iw);
  const y = v => T + ih - (v/MAX)*ih;
  const rated = rows.map((r,n)=>({...r,n})).filter(r=>r.sr!==null&&r.sr!==undefined);
  if(!rated.length) return `<p class="empty">No ratings yet. Add today's rating and the chart starts here.</p>`;

  const roll = rated.map((r,idx)=>{ const w=rated.slice(Math.max(0,idx-6),idx+1);
    return {n:r.n, v:w.reduce((s,a)=>s+a.sr,0)/w.length}; });
  const line = roll.map(p=>`${x(p.n).toFixed(1)},${y(p.v).toFixed(1)}`).join(" L");
  const area = `M${x(roll[0].n).toFixed(1)},${(T+ih).toFixed(1)} L${line} L${x(roll[roll.length-1].n).toFixed(1)},${(T+ih).toFixed(1)} Z`;
  const lastP = roll[roll.length-1];
  const gridVals = MAX===10 ? [0,5,10] : [0,3,6,9];

  return `
  <div class="chart-scroll">
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:340px; display:block" role="img"
         aria-label="Daily stuttering severity rating over the last ${rows.length} days on a 0 to ${MAX} scale, with a 7-day rolling average.">
      ${gridVals.map(v=>`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>
        <text x="${L-7}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="IBM Plex Sans, sans-serif">${v}</text>`).join("")}
      ${rows.map((r,n)=>({r,n})).filter(({n})=>n===0||n===rows.length-1||n===Math.floor(rows.length/2))
        .map(({r,n})=>`<text x="${x(n).toFixed(1)}" y="${H-9}" text-anchor="${n===0?"start":n===rows.length-1?"end":"middle"}" font-size="10.5" fill="var(--muted)" font-family="IBM Plex Sans, sans-serif">${prettyDate(r.date).replace(/^\w+ /,"")}</text>`).join("")}
      <path d="${area}" fill="var(--s1)" fill-opacity=".10"/>
      <path d="M${line}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${rated.map(r=>`<circle cx="${x(r.n).toFixed(1)}" cy="${y(r.sr).toFixed(1)}" r="3.4" fill="var(--s1)" fill-opacity=".38" stroke="var(--surface)" stroke-width="1.5"><title>${prettyDate(r.date)} — severity ${r.sr}</title></circle>`).join("")}
      <circle cx="${x(lastP.n).toFixed(1)}" cy="${y(lastP.v).toFixed(1)}" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
      <text x="${Math.min(W-R, x(lastP.n)+9).toFixed(1)}" y="${(y(lastP.v)-9).toFixed(1)}" text-anchor="end" font-size="12" font-weight="600" fill="var(--ink)" font-family="IBM Plex Sans, sans-serif">${lastP.v.toFixed(1)}</text>
    </svg>
  </div>
  <div class="legend">
    <span><i style="background:var(--s1)"></i>7-day average</span>
    <span><i style="background:var(--s1); opacity:.38"></i>Daily rating</span>
  </div>`;
}

function situationChart(rows){
  const data = SITUATIONS.map(s=>{
    const vals = rows.map(r=>r.sit && r.sit[s.key]).filter(v=>v!==undefined && v!==null);
    return { name:s.name, n:vals.length, avg: vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null };
  }).filter(d=>d.n > 0).sort((a,b)=>b.avg-a.avg);

  if(data.length < 2) return `<p class="empty">Rate a few situations on the Today tab for a week or so and the pattern shows up here.</p>`;

  const W=520, rowH=30, L=150, R=44, T=6, B=8;
  const H = T + data.length*rowH + B, iw = W-L-R, MAX = S.srMax;

  const bars = data.map((d,i)=>{
    const y = T + i*rowH + 5, w = (d.avg/MAX)*iw;
    return `
      <text x="${L-9}" y="${y+13}" text-anchor="end" font-size="12" fill="var(--ink-2)" font-family="IBM Plex Sans, sans-serif">${d.name}</text>
      <rect x="${L}" y="${y}" width="${Math.max(2,w).toFixed(1)}" height="19" rx="4" fill="var(--s1)"><title>${d.name} — average ${d.avg.toFixed(1)} across ${d.n} day${d.n===1?"":"s"}</title></rect>
      <text x="${(L+Math.max(2,w)+7).toFixed(1)}" y="${y+13}" font-size="12" font-weight="600" fill="var(--ink)" font-family="IBM Plex Sans, sans-serif">${d.avg.toFixed(1)}</text>`;
  }).join("");

  return `
  <div class="chart-scroll">
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:360px; display:block" role="img"
         aria-label="Average stuttering severity by situation, worst first, on a 0 to ${MAX} scale.">
      <line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="var(--line-strong)" stroke-width="1"/>
      ${bars}
    </svg>
  </div>`;
}

function transferChart(rows){
  const weeks=[]; for(let i=0;i<rows.length;i+=7) weeks.push(rows.slice(i,i+7));
  const data = weeks.map(w=>({
    label: prettyDate(w[0].date).replace(/^\w+ /,""),
    transfer: w.reduce((s,r)=>s+(r.transfer||0),0),
    days: w.filter(r=>(r.minutes||0)>0).length
  }));
  if(data.every(d=>d.transfer===0 && d.days===0))
    return `<p class="empty">Nothing logged yet.</p>`;
  const max = Math.max(5, ...data.map(d=>Math.max(d.transfer,d.days)));
  const W=520,H=160,L=32,R=12,T=12,B=30, iw=W-L-R, ih=H-T-B;
  const gw = iw/data.length, bw = Math.min(26,(gw-10)/2);

  const bars = data.map((d,n)=>{
    const gx = L + n*gw + (gw - bw*2 - 2)/2;
    const ht = (d.transfer/max)*ih, hd = (d.days/max)*ih;
    return `
      <rect x="${gx.toFixed(1)}" y="${(T+ih-ht).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,ht).toFixed(1)}" rx="4" fill="var(--s1)"><title>${d.label} — ${d.transfer} used in real talk</title></rect>
      <rect x="${(gx+bw+2).toFixed(1)}" y="${(T+ih-hd).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,hd).toFixed(1)}" rx="4" fill="var(--s2)"><title>${d.label} — practised on ${d.days} days</title></rect>
      <text x="${(gx+bw+1).toFixed(1)}" y="${H-9}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="IBM Plex Sans, sans-serif">${d.label}</text>`;
  }).join("");

  return `
  <div class="chart-scroll">
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:340px; display:block" role="img"
         aria-label="Technique used in real conversation versus days practised, totalled per week.">
      <line x1="${L}" y1="${T+ih}" x2="${W-R}" y2="${T+ih}" stroke="var(--line-strong)" stroke-width="1"/>
      <text x="${L-7}" y="${T+4}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="IBM Plex Sans, sans-serif">${max}</text>
      <text x="${L-7}" y="${T+ih+4}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="IBM Plex Sans, sans-serif">0</text>
      ${bars}
    </svg>
  </div>
  <div class="legend">
    <span><i style="background:var(--s1)"></i>Used in real talk</span>
    <span><i style="background:var(--s2)"></i>Days practised</span>
  </div>`;
}

function viewProgress(){
  const rows = last(28);
  const rated = rows.filter(r=>r.sr!==null&&r.sr!==undefined);
  const avg = rated.length ? rated.reduce((s,r)=>s+r.sr,0)/rated.length : null;
  /* Compare the first and second halves of the rated days. Fixed 7-day windows
     overlap when there are fewer than 14 ratings, which quietly reports a
     "shift" computed from the same rows twice. Below 8 ratings, say nothing. */
  const half = Math.floor(rated.length/2);
  const trend = rated.length >= 8
    ? (rated.slice(-half).reduce((s,r)=>s+r.sr,0)/half) - (rated.slice(0,half).reduce((s,r)=>s+r.sr,0)/half)
    : null;
  const practiceDays = rows.filter(r=>(r.minutes||0)>0).length;
  const totalMin = rows.reduce((s,r)=>s+(r.minutes||0),0);
  const transfers = rows.reduce((s,r)=>s+(r.transfer||0),0);

  const html = `
    <h2 class="view-title">Progress</h2>
    <p class="view-sub">Last 28 days. Read the direction of the trend, not individual days — stuttering is naturally variable and a bad day after a good week is normal, not relapse.</p>

    <div class="stat-row">
      <div class="stat"><b>${avg===null?"—":avg.toFixed(1)}</b><span>AVG SEVERITY</span></div>
      <div class="stat"><b style="color:${trend===null?"var(--ink)":trend<-0.3?"var(--good)":trend>0.3?"var(--warm)":"var(--ink)"}">${trend===null?"—":(trend>0?"+":"")+trend.toFixed(1)}</b><span>28-DAY SHIFT</span></div>
      <div class="stat"><b>${practiceDays}<span style="display:inline; font-family:var(--ui); font-size:14px; color:var(--muted); font-weight:500">/28</span></b><span>DAYS PRACTISED</span></div>
    </div>

    <div class="card" style="margin-top:12px">
      <div class="chart-head"><h3 style="margin:0">Severity rating</h3><span class="pill">0–${S.srMax} scale</span></div>
      ${severityChart(rows)}
      <figcaption>Faint dots are individual daily ratings; the line is the 7-day rolling average, which is the one to read. A downward line is progress.</figcaption>
    </div>

    <div class="card">
      <h3>Where the bumps are worst</h3>
      ${situationChart(rows)}
      <figcaption>Average severity by situation, worst first. If the bars are roughly level, context isn't the driver and the work is straightforward motor practice. If one bar stands well clear, that situation is worth naming to your clinician.</figcaption>
    </div>

    <div class="card">
      <h3>Technique in the wild</h3>
      ${transferChart(rows)}
      <figcaption>${transfers} use${transfers===1?"":"s"} in real conversation across ${practiceDays} practice days, ${totalMin} minutes total. Clinic fluency is easy; carrying it into ordinary talk is where programs succeed or fail.</figcaption>
    </div>

    <div class="card">
      <div class="spread" style="margin-bottom:10px">
        <h3 style="margin:0">For your appointment</h3>
        <div class="row" style="gap:7px">
          <button class="btn ghost sm" id="printBtn">Print</button>
          <button class="btn sm" id="csvBtn">Export CSV</button>
        </div>
      </div>
      <table class="log">
        <thead><tr><th>Date</th><th>SR</th><th>Min</th><th>Real talk</th><th>Notes</th></tr></thead>
        <tbody>
          ${rows.slice().reverse().filter(r=>r.sr!==null&&r.sr!==undefined||r.minutes||r.notes||r.transfer).slice(0,14).map(r=>`
            <tr>
              <td class="n" style="color:var(--muted)">${prettyDate(r.date).replace(/^\w+ /,"")}</td>
              <td class="n"><strong>${r.sr===null||r.sr===undefined?"—":r.sr}</strong></td>
              <td class="n">${r.minutes||0}</td>
              <td class="n">${r.transfer||0}</td>
              <td style="font-size:13px; color:var(--ink-2)">${esc((r.notes||"").slice(0,64))}${(r.notes||"").length>64?"…":""}</td>
            </tr>`).join("") || `<tr><td colspan="5" class="empty">Nothing logged yet.</td></tr>`}
        </tbody>
      </table>
    </div>

    <p class="disclaimer">Take this to appointments. Four weeks of daily parent ratings gives a clinician far more
    signal than thirty minutes observing your child in an unfamiliar room — and the Oakville guide notes that a
    child's speech in the clinic often doesn't match their speech at home.</p>`;

  function mount(){
    el("csvBtn").addEventListener("click", exportCSV);
    el("printBtn").addEventListener("click", ()=>window.print());
  }
  return { html, mount };
}

/* Saving a file works two ways depending on where this page is running.
   Opened as a local file or on a normal host, an anchor download works.
   Published as an Artifact, the viewer sandbox blocks that and the host
   mediates saves instead. Resolve once at load, use whichever exists. */
let Downloads = null;
if(window.claude && typeof window.claude.use === "function"){
  window.claude.use("downloads").then(d => { Downloads = d; }).catch(()=>{});
}

async function exportCSV(){
  const rows = last(180).filter(r=>r.sr!==null&&r.sr!==undefined || r.minutes || r.notes || r.transfer || (r.sit&&Object.keys(r.sit).length));
  if(!rows.length) return toast("Nothing to export yet");
  const sitCols = SITUATIONS.map(s=>"sit_"+s.key);
  const head = ["date",`severity_rating_0_${S.srMax}`,"practice_minutes","technique_used_in_real_talk","exercises",...sitCols,"notes"].join(",");
  const body = rows.map(r=>[
    r.date,
    (r.sr===null||r.sr===undefined)?"":r.sr,
    r.minutes||0,
    r.transfer||0,
    `"${(r.done||[]).map(x=>gameById(x)?.name||x).join("; ")}"`,
    ...SITUATIONS.map(s=> (r.sit && r.sit[s.key]!==undefined) ? r.sit[s.key] : ""),
    `"${String(r.notes||"").replace(/"/g,'""')}"`
  ].join(",")).join("\n");
  const csv = head+"\n"+body, filename = `steady-voice-${today()}.csv`;

  if(Downloads){
    try{ await Downloads.save({filename, data:csv}); toast("CSV saved"); }
    catch(err){ if(err && err.code === "declined") return; toast("Couldn't save the CSV here"); }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("CSV downloaded");
}

function viewGuides(){
  return { html:`
    <h2 class="view-title">Guides</h2>
    <p class="view-sub">The short version of the research, aimed at this situation: frequent stuttering across every context, in a child who is confident and unbothered by it.</p>

    <div class="note calm" style="margin-bottom:14px">
      <strong>Your child not being distressed by stuttering is genuinely good news.</strong> The long-term damage
      from childhood stuttering runs largely through avoidance, shame and social anxiety — and none of that is in
      play here. It means the work is straightforward motor skill practice rather than emotional repair, and it
      means a treatment that would be a hard sell to an anxious child is available to you. It does not mean the
      stuttering matters less.
    </div>

    <div class="do-dont" style="margin-bottom:14px">
      <div class="dd do">
        <h4>Do</h4>
        <ul>
          <li>Slow your own speech and pause more. Model it, never instruct it.</li>
          <li>Speak in syllable talking yourself during practice. It's a duet.</li>
          <li>Stop, turn and look when they speak.</li>
          <li>Wait. Let them finish the word.</li>
          <li>Praise the smooth speech generously — far more than you comment on bumps.</li>
          <li>Keep practice short, frequent and enjoyable.</li>
        </ul>
      </div>
      <div class="dd dont">
        <h4>Don't</h4>
        <ul>
          <li>"Slow down." "Relax." "Take a breath." "Think first."</li>
          <li>Finish their words or sentences.</li>
          <li>Ask for a repeat when you aren't certain it was a real stutter.</li>
          <li>Prompt the technique right after a bump — it turns it into a punishment.</li>
          <li>Over-correct. It is the most common reason home programs stall.</li>
          <li>Let practice become boring or repetitive.</li>
        </ul>
      </div>
    </div>

    <details class="acc" open><summary>The Oakville Program, properly explained</summary><div class="acc-body prose">
      <p>Developed by the Australian Stuttering Research Centre. It is the school-age syllable-timed speech
      program, and it is the closest fit to what this app is built around.</p>
      <p><strong>What syllable-timed speech is.</strong> Saying each syllable in time to a rhythmic beat —
      "The chil-dren are play-ing on the tram-po-line." Every syllable evenly stressed and the same length,
      joined smoothly to the next (legato, not staccato), at normal volume, pitch and intonation. It starts
      slow and works up toward near-normal speed. It should never sound chopped up.</p>
      <p><strong>Stage 1.</strong> Weekly 45-minute clinician consultations. Parent and child learn STS by
      demonstration, imitation and practice. Home practice starts at <strong>four to six times a day, five to
      ten minutes each</strong>. Once the child holds STS consistently and complies with the schedule,
      consultations drop to fortnightly.</p>
      <p><strong>Later Stage 1 — hybrid sessions.</strong> Once severity has dropped outside practice,
      sessions become half STS, half natural speech, and reduce to about three a day of 10–15 minutes. The
      ratio then shifts progressively toward natural — 50, 60, 70 per cent — with the goal of eliminating STS
      practice entirely.</p>
      <p><strong>Moving to Stage 2.</strong> For two consecutive fortnightly consultations: clinician severity
      rating 0 or 1, and daily parent ratings of 0 or 1 for the preceding week with at least four days at 0.</p>
      <p><strong>Stage 2.</strong> ~30-minute consultations at widening intervals — four at 4 weeks, two at 8
      weeks, then one or two at 12 weeks — typically until minimal stuttering has held for around a year.
      Parents learn to reintroduce a little practice themselves if severity creeps back to 1 or 2.</p>
      <p><strong>Evidence.</strong> The school-age trial ran 22 children aged 6–11, 19 completing, with a group
      mean severity reduction of <strong>77% at 12 months post-treatment</strong> — 82% excluding the two least
      responsive children. There was considerable individual variation, and many participants had co-occurring
      speech and language problems. That is encouraging rather than conclusive: it is a Phase II trial, not a
      randomised controlled one.</p>
    </div></details>

    <details class="acc"><summary>Why it bumps everywhere, including one to one</summary><div class="acc-body prose">
      <p>Stuttering is neurological. It is <strong>not</strong> caused by anxiety, tiredness, a specific event,
      parenting style, or any psychological problem — Speech Pathology Australia states this explicitly. A child
      who bumps just as much alone with a parent as in front of a class is showing you exactly that: the
      driver is motor, not social.</p>
      <p>That is useful information, and worth telling your clinician. It means the treatment target is speech
      production itself, and it means you should be sceptical of anyone who proposes an anxiety-focused
      approach for this child.</p>
      <p>It also means the <strong>situation ratings</strong> on the Today tab are worth doing for a few weeks.
      If the bars on the situation chart come out roughly level, that confirms the picture and simplifies the
      plan. If one context stands well clear, that is worth knowing too.</p>
    </div></details>

    <details class="acc"><summary>What school age changes</summary><div class="acc-body prose">
      <p>The two-thirds natural recovery figure applies to preschoolers, not to a school-age child who has been
      stuttering for years. A 2021 systematic review and meta-analysis found <strong>no high-level evidence for
      interventions with school-aged children or adolescents</strong> — most randomised trials were done with
      preschoolers.</p>
      <p>That doesn't mean nothing works. It means treatment is genuinely harder and slower at this age,
      individual response varies a lot, and anyone promising a cure is overselling. The Oakville school-age
      trial's own authors describe their results as "sufficiently encouraging to warrant further clinical
      trials" — that is the honest state of the evidence.</p>
    </div></details>

    <details class="acc"><summary>Keeping an eye on the emotional side anyway</summary><div class="acc-body prose">
      <p>Your child is fine about it now. Worth knowing, without borrowing trouble: attitudes to one's own
      speech can shift during the school years, and children who stutter are bullied at markedly higher rates
      than their peers — up to 81% in one review, with the classroom as the main site.</p>
      <p>The useful response is not to talk your child into worrying. It is to <strong>keep the door open</strong>:
      talk about stuttering matter-of-factly, ask occasionally and lightly how school is going for talking,
      and act early if anything changes. A confident child who is treated well stays a confident child.</p>
      <p>If you want a formal measure, ask your speech pathologist about the <strong>OASES-S</strong> or
      <strong>CALMS</strong> — both capture impact and attitude alongside fluency, and a baseline now is worth
      having.</p>
    </div></details>

    <details class="acc"><summary>Five questions for any prospective clinician</summary><div class="acc-body prose">
      <p>Fluency is a sub-specialty, and most general speech pathologists see very few stuttering cases a year.
      A generalist paediatric speech pathologist is not automatically a good choice.</p>
      <ul>
        <li><strong>How many children who stutter are on your caseload right now?</strong> Under five a year is a red flag.</li>
        <li><strong>Are you trained in the Oakville Program or syllable-timed speech?</strong> This is the one that matters most here. Ask by name.</li>
        <li><strong>How do you handle a child who stutters as much one-on-one as in public?</strong> You want a motor-focused answer, not an anxiety-focused one.</li>
        <li><strong>What measures will you use, and will I be keeping daily severity ratings?</strong></li>
        <li><strong>What's your waitlist, and do you offer telehealth?</strong></li>
      </ul>
    </div></details>

    <details class="acc"><summary>School — what to ask for</summary><div class="acc-body prose">
      <p>Still worth doing even for a confident child, because frequent stuttering makes oral tasks slow and
      because teacher habits matter.</p>
      <ul>
        <li><strong>Call on them early</strong> in a round rather than last.</li>
        <li><strong>Paired or unison reading</strong> for reading aloud — most children who stutter are fluent
        reading in unison. It is the single best classroom accommodation.</li>
        <li><strong>Oral presentations</strong> — extra time rather than exemption. They want to present; they
        just need the clock not to be the problem.</li>
        <li><strong>No marking down</strong> for dysfluency in spoken assessment.</li>
        <li><strong>Same academic expectations</strong> as every other student.</li>
        <li><strong>No coaching from the teacher</strong> — no "slow down", no finishing words, no waiting-face.</li>
      </ul>
      <p>Since your child is comfortable talking about it, a short matter-of-fact self-introduction to a new
      class or teacher — "I stutter, it just means sometimes you wait a sec" — costs them nothing and sets the
      norm for the year.</p>
    </div></details>

    <details class="acc"><summary>Rating consistently</summary><div class="acc-body prose">
      <p>Oakville uses a 0–10 scale (0 = no stuttering, 1 = extremely mild, 10 = extremely severe); Lidcombe
      uses 0–9. This app defaults to 0–10 and you can switch it in Find help → Settings to match your clinician.</p>
      <p>One rating a day, reflecting the majority of the day. Acceptable accuracy is your rating landing within
      one point of the clinician's; later in treatment, when severity is low, they will want them identical
      because there is less margin for error.</p>
      <p>A recording of a few minutes of ordinary conversation is a more realistic sample than trying to
      remember the whole day, and it lets a clinician check your calibration.</p>
      <p><strong>Rate after they're in bed.</strong> If the number becomes a score the child is graded on, you
      have created a pressure that wasn't there.</p>
      <p>From about age 9, children can be trained to rate themselves alongside the parent — which gives you
      information about school and friends that you otherwise never see. Their ratings will sometimes differ
      from yours; that difference is data, not an error.</p>
    </div></details>

    <details class="acc"><summary>Paying for it in Australia</summary><div class="acc-body prose">
      <p><strong>Medicare, expanded 1 March 2026.</strong> A dedicated pathway now exists for stuttering
      specifically: up to <strong>8 assessment</strong> and <strong>20 treatment</strong> sessions, a lifetime cap
      before age 25, rebate $87.25 per session. Referral from a GP or specialist — <strong>no care plan needed</strong>.
      MBS items: assessment 82005 / 93033 / 93041, treatment 82020 / 93036 / 93044.</p>
      <p>This is new enough that not every GP knows about it. Quote the item numbers.</p>
      <p><strong>Chronic Condition Management Plan</strong> — the older pathway, 5 sessions a year at a lower
      rebate. Still available and usable alongside the new items, just not on the same day.</p>
      <p><strong>NDIS</strong> — possible where there's substantial functional impairment, more commonly funded
      where there's a co-occurring diagnosis. Worth exploring, not worth counting on.</p>
      <p><strong>Public</strong> — Queensland Health Child Development Service. Free, waitlisted. Get on the list
      in parallel with everything else.</p>
    </div></details>`,
    mount(){} };
}
