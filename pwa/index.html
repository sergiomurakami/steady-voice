      treatment for school-age children and train other clinicians in it. For this profile they are the
      obvious first call.</p>
      <p class="contact">asrc@uts.edu.au · +61 2 9514 5314<br>Level 13, Building One, 15 Broadway, Ultimo NSW 2007</p>
      <a href="https://www.stutteringtreatment.com.au/" target="_blank" rel="noopener">stutteringtreatment.com.au ↗</a>
    </div>
    <div class="note calm" style="margin-top:10px">
      <strong>Ask for the Oakville Program by name</strong>, or for syllable-timed speech for school-age
      children. It is the treatment this app is built around, and clinicians trained in it are not evenly
      spread — their STS workshops are run for speech pathologists Australia-wide by Zoom, so a local
      clinician can be pointed at the training.
    </div>

    <p class="eyebrow" style="margin-top:20px">Public, free, waitlisted</p>
    <div class="clinic">
      <h4>Gold Coast Child Development Service</h4>
      <p class="meta">Queensland Health</p>
      <p>Free. Get on the waitlist now, in parallel with private options — the waitlist is the constraint, not the eligibility.</p>
      <p class="contact">07 5687 9183 (option 2) · cdsgoldcoast@health.qld.gov.au</p>
      <a href="https://www.goldcoast.health.qld.gov.au/our-services/childrens-services/community-child-health/speak-with-me" target="_blank" rel="noopener">goldcoast.health.qld.gov.au ↗</a>
    </div>

    <p class="eyebrow" style="margin-top:20px">Local — Gold Coast</p>
    <div class="clinic">
      <h4>Little Language Speech Pathology</h4>
      <p class="meta">Robina · ages 18 months to 18 years · clinic, school-based and telehealth</p>
      <p>Treats stuttering among other areas. <strong>Not verified as a fluency specialist</strong> — use the
      five questions in Guides, and ask specifically about syllable-timed speech, before committing. Free
      initial phone consult with a speech pathologist.</p>
      <p class="contact">(07) 5679 5609 · roar@littlelanguage.com.au<br>Suite 1, 29 Commerce Drive, Robina QLD 4226</p>
      <a href="https://www.littlelanguage.com.au/" target="_blank" rel="noopener">littlelanguage.com.au ↗</a>
    </div>
    <div class="note" style="margin-top:10px">
      Other Gold Coast paediatric practices exist — Family Nurture, BillyLids Therapy, Queensland Paediatric
      Allied Health, Speech and Growth Clinic. None advertise fluency specialisation prominently enough to
      recommend sight-unseen. Ring them with the five questions.
    </div>

    <p class="eyebrow" style="margin-top:20px">Telehealth, Australia-wide</p>
    <div class="clinic">
      <h4>Banter Speech &amp; Language</h4>
      <p class="meta">Sydney-based · telehealth Australia-wide</p>
      <p>Writes about stuttering treatment unusually honestly, including its limitations.</p>
      <p class="contact">02 8757 3838</p>
      <a href="https://www.banterspeech.com.au/lidcombe-program/" target="_blank" rel="noopener">banterspeech.com.au ↗</a>
    </div>

    <p class="eyebrow" style="margin-top:20px">Global</p>
    <div class="clinic">
      <h4>Michael Palin Centre for Stammering</h4>
      <p class="meta">London · remote sessions available</p>
      <p>The leading school-age centre internationally. Their programme leads with confidence and anxiety
      before fluency, which is a weaker fit for this profile than Oakville — but they are worth knowing about,
      and their materials are excellent.</p>
      <a href="https://michaelpalincentreforstammering.org/" target="_blank" rel="noopener">michaelpalincentreforstammering.org ↗</a>
    </div>
    <div class="clinic">
      <h4>Stuttering Foundation</h4>
      <p class="meta">United States · free resources</p>
      <p>Not a clinic. The best free resource library in the world, including the teacher materials this app's
      school guidance draws on.</p>
      <a href="https://www.stutteringhelp.org/" target="_blank" rel="noopener">stutteringhelp.org ↗</a>
    </div>

    <p class="eyebrow" style="margin-top:20px">Community</p>
    <div class="clinic">
      <h4>STUTTA — Australian Stuttering Association</h4>
      <p class="meta">Online · "Speak Freely" 1st &amp; 3rd Wednesday, 7pm AEST</p>
      <p>By and for people who stutter. Family members welcome. For a child who is already comfortable talking
      about it, meeting adults who stutter and are getting on with life is straightforwardly good.</p>
      <a href="https://stutta.org/" target="_blank" rel="noopener">stutta.org ↗</a>
    </div>
    <div class="clinic">
      <h4>Speak Easy Association Australia</h4>
      <p class="meta">National support group network</p>
      <a href="https://speakeasy.org.au/" target="_blank" rel="noopener">speakeasy.org.au ↗</a>
    </div>

    <p class="eyebrow" style="margin-top:20px">Finding anyone else</p>
    <div class="clinic">
      <h4>Speech Pathology Australia — Find a Speech Pathologist</h4>
      <p>The authoritative national directory. Filter by fluency and telehealth. Use this rather than the SEO
      aggregator sites, which rank clinics by advertising spend rather than expertise.</p>
      <a href="https://www.speechpathologyaustralia.org.au/" target="_blank" rel="noopener">speechpathologyaustralia.org.au ↗</a>
    </div>

    <div class="card" style="margin-top:18px">
      <h3>A practical order of operations</h3>
      <ol class="prose" style="padding-left:20px; margin:0">
        <li>Get on the Queensland Health waitlist today. One phone call, costs nothing.</li>
        <li>Book a GP appointment this month and ask for a referral under the new stuttering MBS items — quote the numbers.</li>
        <li>Book a telehealth assessment with the ASRC clinic and ask about the Oakville Program specifically.</li>
        <li>Spend the 20 rebated treatment sessions on whoever that plan says should deliver it.</li>
      </ol>
    </div>

    <div class="card">
      <h3>Settings</h3>
      <label class="fld" for="kidName">Child's first name</label>
      <input type="text" id="kidName" value="${esc(S.profile.name||"")}" placeholder="Used only for the greeting">
      <label class="fld" for="srScaleSel" style="margin-top:14px">Severity rating scale</label>
      <select id="srScaleSel">
        <option value="10" ${S.srMax===10?"selected":""}>0–10 · Oakville Program</option>
        <option value="9" ${S.srMax===9?"selected":""}>0–9 · Lidcombe Program</option>
      </select>
      <p style="margin:6px 0 0; font-size:12.5px; color:var(--muted)">Match whichever your speech pathologist uses. Existing ratings are not rescaled.</p>
      <p style="margin:14px 0 0; font-size:12.5px; color:var(--muted); line-height:1.5">
        Everything this app records — ratings, notes, situation scores — is stored in this browser on this
        device only. Nothing is uploaded, no account, no speech recognition. Recordings exist only while you're
        on that screen. Export the CSV to keep a copy.
      </p>
      <button class="btn ghost sm" style="margin-top:12px" id="wipeBtn">Erase all data</button>
    </div>`,
    mount(){
      el("kidName").addEventListener("input", e=>{ S.profile.name=e.target.value; save(); el("whoLabel").textContent = e.target.value ? "· "+e.target.value : ""; });
      el("srScaleSel").addEventListener("change", e=>{ S.srMax=+e.target.value; save(); toast(`Scale set to 0–${S.srMax}`); });
      el("wipeBtn").addEventListener("click", ()=>{
        if(!confirm("Erase every rating, note and log on this device? This cannot be undone.")) return;
        S = JSON.parse(JSON.stringify(DEFAULTS)); S.profile.startedOn = today(); save(); toast("Erased"); go("track");
      });
    }};
}

/* ── 6. RENDER + ROUTER ─────────────────────────────────────────────── */
const VIEWS = {
  today: viewToday, practice: viewPractice, read: viewRead, outloud: viewOutLoud, talk: viewTalk,
  track: viewTrack, progress: viewProgress, guides: viewGuides, help: viewHelp
};

function render(){
  if(cleanup){ cleanup(); cleanup=null; }
  const kidRoutes=["today","practice","read","outloud","talk","game"];
  const parentRoutes=["track","progress","guides","help"];
  if(S.mode==="kid" && parentRoutes.includes(route)) route="today";
  if(S.mode==="parent" && kidRoutes.includes(route)) route="track";

  const v = route==="game" ? viewGame(routeArg) : (VIEWS[route] || viewToday)();
  el("view").innerHTML = v.html;
  renderTabs(); drawRuleWave();
  el("whoLabel").textContent = S.profile.name ? "· "+S.profile.name : "";
  el("modeBtn").classList.toggle("on", S.mode==="parent");
  el("modeBtn").title = S.mode==="parent" ? "Switch to your child's view" : "Switch to the grown-up view";
  v.mount();

  document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));
  document.querySelectorAll("[data-game]").forEach(b=>b.addEventListener("click",()=>go("game", b.dataset.game)));
}

el("modeBtn").addEventListener("click", ()=>{
  S.mode = S.mode==="kid" ? "parent" : "kid"; save();
  route = S.mode==="kid" ? "today" : "track";
  render(); window.scrollTo(0,0);
  toast(S.mode==="kid" ? "Child's view" : "Grown-up view");
});
el("themeBtn").addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : cur==="light" ? null : "dark";
  if(next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  S.theme = next; save();
});

/* Ask the browser not to evict our storage. This matters: everything the
   parent records lives in localStorage, and both WebKit and Blink will clear
   script-writable storage under space pressure or after long disuse. WebKit
   grants persistence on heuristics — "whether the website is opened as a Home
   Screen Web App" is one of them — so installing to the home screen and
   calling this together is the real defence. Best effort; never load-bearing. */
if(navigator.storage && navigator.storage.persist){
  navigator.storage.persisted().then(already => {
    if(!already) return navigator.storage.persist();
  }).catch(()=>{});
}

/* Offline. Registered only from a secure origin — a service worker cannot run
   from file://, which is exactly why the app needs to be served over HTTPS to
   work offline properly. Harmlessly skipped when opened as a local file. */
/* isSecureContext is the correct test, not a hostname string: it is already
   true for https, localhost AND 127.0.0.1, and a hand-rolled check misses one
   of those every time. file:// is excluded explicitly because Chrome reports
   it as secure but refuses to register a worker there. */
if("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:"){
  /* Register immediately rather than on window.load. The page pulls its fonts
     from Google Fonts, and waiting for load means a slow or unreachable font
     host delays offline availability — or loses it entirely if the app is
     closed before load fires. The worker is 2KB and does not compete with
     first paint in any way that matters. */
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}

if(S.theme) document.documentElement.setAttribute("data-theme", S.theme);
S.lastOpen = today(); save();
route = S.mode==="parent" ? "track" : "today";
render();
</script>

</body>
</html>
